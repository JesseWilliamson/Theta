name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Pushes to main run to completion (several agents push in quick succession and cancelling
  # every run would mean no run ever finishes); only superseded pull-request runs are cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 5
  # Debug info is useless in CI logs and is most of the target directory's size.
  RUSTFLAGS: -C debuginfo=0
  # Exact toolchain for CI (rust-toolchain.toml only says "stable" for local use). gpui needs >= 1.99 on macOS.
  RUST_TOOLCHAIN: "1.99.1"
  # beats rust-toolchain.toml, which only says "stable"; keep equal to RUST_TOOLCHAIN
  RUSTUP_TOOLCHAIN: "1.99.1"

jobs:
  # Formatting is its own job so that it never blocks the build/test jobs. It
  # becomes a required check once every crate is formatted.
  fmt:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - run: cargo fmt --all -- --check

  # Pure crates: fast, no GPU or window system needed, plus the database
  # integration tests against real servers.
  libraries:
    runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: -C debuginfo=0 -C link-arg=-fuse-ld=mold
      # The live tests of the products that need a server of their own (crates/theta-drivers/tests/
      # kinds_live.rs). A test whose variable is unset prints SKIPPED and passes, so these lines are the
      # whole switch. Redshift and YugabyteDB have no CI service (Redshift is AWS only; a YugabyteDB
      # cluster is too heavy for a hosted runner) and stay unverified.
      THETA_TEST_COCKROACH_URL: postgresql://root@127.0.0.1:26257/defaultdb?sslmode=disable
      THETA_TEST_TIMESCALE_URL: postgresql://postgres:postgres@127.0.0.1:5433/postgres?sslmode=disable
      THETA_TEST_TIDB_URL: mysql://root@127.0.0.1:4000/test
      THETA_TEST_SQLSERVER_URL: sqlserver://sa:Theta_Test_1@127.0.0.1:1433/master?encrypt=true&trustServerCertificate=true
      THETA_TEST_CLICKHOUSE_URL: clickhouse://theta:theta@127.0.0.1:8123/default
    services:
      timescale:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 20
      # SQL Server takes the better part of a minute to accept logins on a cold runner.
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-CU14-ubuntu-22.04
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Theta_Test_1
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Theta_Test_1 -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P Theta_Test_1 -Q 'SELECT 1'"
          --health-interval 10s --health-timeout 10s --health-retries 30 --health-start-period 20s
      clickhouse:
        image: clickhouse/clickhouse-server:24.8
        env:
          CLICKHOUSE_USER: theta
          CLICKHOUSE_PASSWORD: theta
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports: ["8123:8123"]
        options: >-
          --health-cmd "wget --spider -q http://localhost:8123/ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: quarry_demo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 20
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: quarry_demo
          MARIADB_USER: quarry
          MARIADB_PASSWORD: quarry
        ports: ["3306:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: libraries
      - name: Install linker
        run: sudo apt-get update && sudo apt-get install -y mold
      # The tests create their own databases, which the MARIADB_USER account
      # (privileges on quarry_demo only) may not do. The runner has no mysql
      # client, so run the client that ships inside the service container.
      - name: Grant the test user access to every MariaDB database
        run: |
          id=$(docker ps --filter "ancestor=mariadb:10.11" --format '{{.ID}}' | head -n1)
          docker exec "$id" mariadb -uroot -proot \
            -e "GRANT ALL ON *.* TO 'quarry'@'%'; FLUSH PRIVILEGES;"
      # CockroachDB and TiDB need a start command, which service containers cannot pass, so they are
      # started here and waited for explicitly. Both run as a single in-memory node.
      - name: Start CockroachDB and TiDB
        run: |
          docker run -d --name crdb -p 26257:26257 cockroachdb/cockroach:v24.3.4 start-single-node --insecure
          docker run -d --name tidb -p 4000:4000 pingcap/tidb:v8.1.1
          for i in $(seq 1 60); do
            docker exec crdb ./cockroach sql --insecure -e 'SELECT 1' >/dev/null 2>&1 && break
            sleep 2
          done
          for i in $(seq 1 60); do
            (exec 3<>/dev/tcp/127.0.0.1/4000) >/dev/null 2>&1 && break
            sleep 2
          done
          docker exec crdb ./cockroach sql --insecure -e 'SELECT version()'
      - name: Wait for the database servers
        run: |
          for port in 1433 8123 5433; do
            for i in $(seq 1 60); do
              (exec 3<>/dev/tcp/127.0.0.1/$port) >/dev/null 2>&1 && break
              sleep 2
            done
          done
      - run: >
          cargo clippy -p theta-core -p theta-sql -p theta-geo -p theta-editor -p theta-drivers -p theta-import
          --all-targets -- -D warnings
      - run: cargo test -p theta-core -p theta-sql -p theta-geo -p theta-editor -p theta-drivers -p theta-import
      # A throw-away sshd on 127.0.0.1:2222; see crates/theta-drivers/tests/ssh/setup.sh. The key
      # directory must be world-traversable (/tmp, not the runner's home): sshd reads
      # authorized_keys as the test user.
      - name: SSH tunnel tests
        env:
          THETA_TEST_SSH: "1"
          THETA_TEST_SSH_DIR: /tmp/theta-ssh-test
        run: |
          sudo apt-get install -y openssh-server
          sudo -E crates/theta-drivers/tests/ssh/setup.sh
          # the tests read the client keys as the unprivileged runner user
          sudo chown -R "$(id -u):$(id -g)" "$THETA_TEST_SSH_DIR"
          cargo test -p theta-drivers --test ssh
          sudo -E crates/theta-drivers/tests/ssh/setup.sh stop

  # The GPUI application on every platform we ship: build everything, run all
  # tests (the Linux ones under a virtual X server with a software Vulkan driver).
  app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rustflags: -C debuginfo=0 -C link-arg=-fuse-ld=mold
          - os: macos-15
            rustflags: -C debuginfo=0
          - os: windows-2022
            rustflags: -C debuginfo=0
    name: app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: app-${{ matrix.os }}
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mold clang libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libxcb1-dev libxcb-xkb-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libfontconfig-dev libasound2-dev libssl-dev libzstd-dev \
            libvulkan1 mesa-vulkan-drivers xvfb
      - run: cargo build --workspace --all-targets
      # theta-import's pipeline tests need the live databases that only the libraries job
      # starts, so the app jobs run just that crate's pure unit tests.
      - name: Tests (headless)
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo test --workspace --exclude theta-drivers --exclude theta-import && cargo test -p theta-import --lib
      - name: Tests
        if: runner.os != 'Linux'
        run: cargo test --workspace --exclude theta-drivers --exclude theta-import && cargo test -p theta-import --lib

  # Non-blocking until the whole workspace is warning-free.
  clippy:
    runs-on: ubuntu-24.04
    continue-on-error: true
    env:
      RUSTFLAGS: -C debuginfo=0 -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mold clang libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libxcb1-dev libxcb-xkb-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libfontconfig-dev libasound2-dev libssl-dev libzstd-dev
      - run: cargo clippy --workspace --all-targets -- -D warnings
