[package]
name = "theta-drivers"
description = "PostgreSQL, MySQL/MariaDB and SQLite drivers plus SSH tunnelling for Theta."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
theta-core.workspace = true
tokio.workspace = true
async-trait.workspace = true
serde_json.workspace = true
futures-util = "0.3"
tokio-postgres = "0.7.18"
postgres-protocol = "0.6"
tokio-postgres-rustls = { version = "0.14.0", features = ["aws-lc-rs"] }
mysql_async = { version = "0.37.1", default-features = false, features = ["default-rustls"] }
rusqlite = { version = "0.41.1", features = ["bundled", "column_metadata", "column_decltype"] }
russh = "0.65.1"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-native-certs = "0.8"
webpki-roots = "1"

[dev-dependencies]
theta-sql.workspace = true
url.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "process"] }
