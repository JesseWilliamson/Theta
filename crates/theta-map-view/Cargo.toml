[package]
name = "theta-map-view"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
gpui-kit.workspace = true
theta-geo.workspace = true
theta-ui = { path = "../theta-ui" }
serde_json.workspace = true
dirs.workspace = true
async-channel = "2"
# Blocking HTTP client: tile fetches run on plain worker threads, so no async runtime is
# needed. `platform-verifier` trusts the OS certificate store (corporate proxies).
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[dev-dependencies]
tempfile = "3"

[[example]]
name = "map_demo"
path = "examples/map_demo.rs"
