<!doctype html>
<meta charset="utf-8">
<title>Theta social card (1200x630), rendered by render_assets.mjs</title>
<style>
  @font-face { font-family: "IBM Plex Sans"; font-weight: 600; src: url("../assets/fonts/IBMPlexSans-SemiBold.woff") format("woff"); }
  @font-face { font-family: "IBM Plex Sans"; font-weight: 400; src: url("../assets/fonts/IBMPlexSans-Regular.woff") format("woff"); }
  @font-face { font-family: "Lilex"; font-weight: 500; src: url("../assets/fonts/Lilex-Medium.woff") format("woff"); }
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; position: relative; overflow: hidden; background: #181b1f; color: #dce0e5; font-family: "IBM Plex Sans", sans-serif; }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px); background-size: 60px 60px; background-position: 30px 30px; -webkit-mask-image: radial-gradient(ellipse 90% 90% at 70% 40%, #000 25%, transparent 80%); }
  .frame { position: absolute; inset: 40px; border: 1px solid rgba(255,255,255,.14); }
  .mark { position: absolute; right: 120px; top: 95px; width: 300px; color: #74ade8; }
  .mark svg { width: 100%; display: block; }
  .mark g { stroke-width: 0.8; }
  .text { position: absolute; left: 100px; top: 0; bottom: 0; width: 640px; display: flex; flex-direction: column; justify-content: center; }
  .eyebrow { font: 500 20px/1 "Lilex", monospace; letter-spacing: .14em; text-transform: uppercase; color: #a9afbc; margin-bottom: 28px; }
  h1 { margin: 0; font-size: 92px; line-height: 1; letter-spacing: -0.035em; font-weight: 600; color: #f2f4f7; }
  p { margin: 28px 0 0; font-size: 36px; line-height: 1.25; letter-spacing: -0.01em; color: #dce0e5; max-width: 600px; }
  .foot { position: absolute; left: 100px; bottom: 74px; font: 500 20px/1 "Lilex", monospace; letter-spacing: .06em; color: #a9afbc; }
</style>
<div class="grid"></div>
<div class="frame"></div>
<div class="mark"><svg viewBox="0 0 32 44"><g fill="none" stroke="currentColor"><ellipse cx="16" cy="22" rx="9.8" ry="14"/><path d="M6.2 22H25.8"/></g></svg></div>
<div class="text">
  <div class="eyebrow">Alpha &middot; open source</div>
  <h1>Theta</h1>
  <p>A keyboard-first database IDE.</p>
</div>
<div class="foot">Helix &middot; Vim &middot; Standard &nbsp;/&nbsp; PostgreSQL &middot; MySQL &middot; SQLite</div>
