<style>

  @font-face { font-family: "Lilex"; font-weight: 400; src: url("../assets/fonts/Lilex-Regular-Latin.woff2") format("woff2"); }
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; position: relative; overflow: hidden; background: #111216; color: #b4bac8; font-family: "IBM Plex Serif", serif; }
  /* the site's grid: 48px cells, a dot on every third crossing */
  .grid { position: absolute; inset: 0;

    -webkit-mask-image: radial-gradient(ellipse 80% 90% at 75% 40%, #000 20%, transparent 80%); }
  .frame { position: absolute; inset: 40px; border: 1px solid rgba(255,255,255,.12); }
  .mark { position: absolute; right: 160px; top: 120px; width: 212px; color: #74ade8; }
  .mark svg { width: 100%; display: block; }
  .text { position: absolute; left: 100px; top: 0; bottom: 0; width: 700px; display: flex; flex-direction: column; justify-content: center; }
  .eyebrow { font: 400 20px/1 "Lilex", monospace; letter-spacing: .05em; text-transform: uppercase; color: #8e95a6; margin-bottom: 30px; }
  h1 { margin: 0; font-size: 124px; line-height: 1.05; letter-spacing: -0.02em; font-weight: 300; font-style: italic; color: #8fbcf0; }
  p { margin: 26px 0 0; font-size: 42px; line-height: 1.25; letter-spacing: -0.01em; font-weight: 300; color: #f3f5f9; max-width: 640px; }
  .foot { position: absolute; left: 100px; bottom: 74px; font: 400 20px/1 "Lilex", monospace; letter-spacing: .03em; color: #8e95a6; }
</style>
