[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0-alpha.4"
repository = "https://github.com/JesseWilliamson/Quarry"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
gpui-kit = { version = "=0.9.1", features = ["tree-sitter-sql"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
image = { version = "0.25", default-features = false, features = ["png"] }
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "fs"] }
theta-core = { path = "crates/theta-core" }
theta-drivers = { path = "crates/theta-drivers" }
theta-sql = { path = "crates/theta-sql" }
theta-geo = { path = "crates/theta-geo" }
theta-editor = { path = "crates/theta-editor" }
dirs = "6"
url = "2"
uuid = { version = "1", features = ["v4"] }
theta-ui = { path = "crates/theta-ui" }
theta-grid = { path = "crates/theta-grid" }
theta-map-view = { path = "crates/theta-map-view" }
theta-editor-view = { path = "crates/theta-editor-view" }
theta-plan-view = { path = "crates/theta-plan-view" }

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
