[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
gpui-kit = { version = "=0.9.1", features = ["tree-sitter-sql"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
image = { version = "0.25", default-features = false, features = ["png"] }
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "fs"] }
quarry-core = { path = "crates/quarry-core" }
quarry-drivers = { path = "crates/quarry-drivers" }
quarry-sql = { path = "crates/quarry-sql" }
quarry-geo = { path = "crates/quarry-geo" }
quarry-editor = { path = "crates/quarry-editor" }
dirs = "6"
url = "2"
uuid = { version = "1", features = ["v4"] }
quarry-ui = { path = "crates/quarry-ui" }
quarry-grid = { path = "crates/quarry-grid" }
quarry-map-view = { path = "crates/quarry-map-view" }
quarry-editor-view = { path = "crates/quarry-editor-view" }
quarry-plan-view = { path = "crates/quarry-plan-view" }

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
